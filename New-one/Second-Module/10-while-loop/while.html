<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>While Loop in Js</title>
</head>
<body>
  <script>
    var text = '';
    var incrementor = 0;
    while (incrementor < 10) {
      //+= takes the current value of text and adds to it; \\text += new value \===\ text = text + new value
     text += "The incrementor has gone up to " + incrementor + "\n";
      incrementor++;
    }
     alert(text);
  </script>
</body>
</html>
