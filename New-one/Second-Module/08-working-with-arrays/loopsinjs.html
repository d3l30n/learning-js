<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working with Arrays</title>
</head>
<body>
  <h1>Loops in JS</h1>
   <script>
    var colors = ['red', 'blue', 'yellow', 'green','orange', 'purple'];
    //with the "length", doesn't matter how much elements we add in the array, it will always keep track of the number of elements
    for (var i = 0; i < colors.length; i++) {
      console.log(colors[i]);
    }
     
   </script>
</body>
</html>
