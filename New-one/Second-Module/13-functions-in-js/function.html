<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Functions in Js</title>
</head>
<body>
  <h1>Functions in JavaScript</h1>
  <script>
    //functions are reusable sets of instructions

    function doStuff(){
      var myString = 'Here\'s a string of text!';
      var upperString = myString.toUpperCase();
      console.log(myString);
      console.log(upperString);
    }
     doStuff();


     //the structure of a function is as follows:
     //function functionName(parameters) {
     //  // code to be executed
     //} 
     //And then you can call the function by its name followed by parentheses
  </script>
  
</body>
</html>
