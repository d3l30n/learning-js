<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loops in Js</title>
</head>
<body>
   <script>
    // var i = 0; (< Initializer counter)| i < 10; (< Condition)| i++ (< Incrementor)
     for (var i = 0; i < 10; i++) {
       alert("This is loop iteration number: " + i);
     }
   </script>
</body>
</html>
