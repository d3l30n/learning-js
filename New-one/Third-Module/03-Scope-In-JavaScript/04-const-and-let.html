<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
</head>
<body>
  <h1>Testing const and let in JavaScript</h1>

  <script>
    "use strict";

    const constVariable = "I am a constant";
    let letVariable = "I am a variable";

    console.log(constVariable);
    console.log(letVariable);

    //constVariable = "New value"; // This will throw an error

    for( var i = 0; i < 10; i++){
      console.log(i);
    }


    console.log(`the value of i is ${i}`); // This will throw an error

    //with var we dont have a block level scope, but with let we do
    //we dont use var anymore
    //is recommended to use const, and let 
  </script>

</body>
</html>
