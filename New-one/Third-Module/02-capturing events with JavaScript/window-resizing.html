<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window Resizing</title>
</head>
<body>
   <h1>Resizing the Window</h1>

   <script>

      window.addEventListener('resize', function(){
        console.log(`The Window width is ${window.innerWidth} and the height is ${window.innerHeight}`);
      });
   </script>
  
</body>
</html>
