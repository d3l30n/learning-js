<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which Key was Pressed</title>
</head>
<body>Which Key was Pressed</h1>
  <p>Press a key on your keyboard</p>

  <script>
    document.addEventListener('keydown', function(event){
      alert(`A key was pressed! The key is: ${event.key}`);
    }); 

  </script>
</body>
</html>
