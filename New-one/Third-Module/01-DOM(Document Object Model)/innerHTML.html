<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inner Html</title>
</head>
<body>
  <h1>Inner HTML Example</h1>
  <div id="special">
    <p>This is a paragraph.</p>
    <p>This is another paragraph.</p>
    <p>This is yet another paragraph.</p>
  </div>
  <script>
    document.querySelector('#special').innerHTML = "<p>Cthulhu fhtagn!</p>"; 

  </script>
</body>
</html>
